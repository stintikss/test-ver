<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестовый сайт</title>
  <meta name="description" content="Простой тестовый сайт для Vercel">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="badge">Vercel Demo</div>
      <h1>Тестовый сайт</h1>
      <p class="subtitle">Если ты видишь эту страницу — сайт успешно развернут.</p>

      <div class="status">
        <span class="dot"></span>
        <span>Сайт работает</span>
      </div>

      <button id="testButton">Нажми меня</button>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
